; Config for `release-tool android` (build an APK and upload it under a fixed name).
; Keep this file OUT of version control — it holds FTP credentials.
; NOTE: configparser does not strip inline `;`/`#` comments — keep active values
; bare; put comments on their own lines.

[FTP]
host = ftp.example.com
port = 21
username = deploy_user
password = your_password
remote_path = /downloads/
; REQUIRED for `android`: the name the APK gets on the server. The APK is renamed
; on upload, so the download URL never changes between releases. Must be a bare
; filename — the directory belongs in remote_path above.
remote_filename = myapp.apk
; Optional: base of the public download URL, reported after a successful upload.
; The URL is derived as <public_url_base>/<remote_filename>, so it cannot drift.
public_url_base = https://example.com/apps

[OldFileHandling]
; "delete" replaces the APK in place, which is what a fixed download URL wants.
; "rename" would archive each previous APK under subfolder_base instead.
policy = delete

; The whole [Build] section is optional — these are the defaults, which fit a
; standard Flutter project. Uncomment only what differs.
[Build]
; Build commands are argv (parsed with shlex, so quotes work) and run with the
; working directory set to --project-root.
; command        = fvm flutter build apk --release
; command_debug  = fvm flutter build apk --debug
; Artifact each command produces, relative to the project root.
; apk            = build/app/outputs/flutter-apk/app-release.apk
; apk_debug      = build/app/outputs/flutter-apk/app-debug.apk
; File holding the `version: <name>+<build>` line that gets bumped.
; version_file   = pubspec.yaml
; Release builds always bump the build number; debug builds only with this on.
; bump_on_debug  = false
