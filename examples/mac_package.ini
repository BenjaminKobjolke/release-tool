; App-specific config for `release-tool mac-package`.
; Shared signing identities and the notarytool profile belong in the gitignored
; mac_signing.ini at the release-tool checkout root (see mac_signing.ini example).

[MacPackage]
identifier = ai.xida.cmdai
install_location = /usr/local/bin/aicmd
scripts = releases_addons/mac/scripts
version_file = version.txt
output = releases/mac/aicmd_v{version}.pkg
; Optional; defaults to release-tool's generic PyInstaller entitlements.
; entitlements = releases_addons/mac/entitlements.plist

; Optional app-specific overrides; values here take precedence over mac_signing.ini.
; [MacSigning]
; app_identity = Developer ID Application: Your Name (TEAMID)
; installer_identity = Developer ID Installer: Your Name (TEAMID)
; keychain_profile = your-profile
