; Config for `release-tool create` (full-release orchestration).
; Set only what differs from the defaults shown in comments.
; NOTE: configparser does not strip inline `;`/`#` comments — keep active values
; bare; put comments on their own lines.

[Release]
; commit scope: "RELEASE (<scope>): <label>"
scope = app
; named in the publish prompt
publish_platform = Google Play Store

; --- optional overrides (conventional defaults shown) ---
; notes_dir = release_notes
; en_file = en.json
; label_format = {version}_{build}
; notes_label_format = {version}_{build}  ; notes-folder key; defaults to label_format.
;   Set it when the notes folder must differ from the commit/tag label (e.g. Flutter/Play
;   keys notes by build number: label_format={version}+{build}, notes_label_format={build}).
;   See docs/NOTES_LABEL_FORMAT.md.
; english_only = false               ; true => skip the translate step
; versioning = build                 ; build | semver
;   build  => label = label_format with a build counter (build_get) bumped each
;             release (build_increment).
;   semver => no build counter: each release bumps the last segment of the version
;             (0.1.6 -> 0.1.7). build_get and label_format are unused;
;             build_increment/build_decrement are the version bump/rollback bats.
; previous_version_file => where the previous (online) version is recorded for the
;             publish bat to read (default tools/previous_version.txt). Gitignore it.
; previous_version_file = tools/previous_version.txt

[Bats]
; All paths are relative to the project root. Omit a line to keep the default.
; version_get     = tools/version_get.bat
; build_get       = tools/build_get.bat
; build_increment = tools/build_increment.bat
; build_decrement = tools/build_decrement.bat
; translate       = tools/translator_app-release-notes.bat
; build           = tools/build_release.bat

; publish has NO default. Set it to offer the publish gate (asked y/N after build).
; The bat is called with NO arguments — it reads previous_version_file for
; --previous-version. Leaving publish out just skips that gate; the commit/tag/push
; gate is still offered.
publish = tools/publish_release.bat
