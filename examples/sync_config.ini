; Config for `release-tool sync` (upload a local directory tree to an FTP remote).
; Keep this file OUT of version control — it holds FTP credentials.
; NOTE: configparser does not strip inline `;`/`#` comments — keep active values
; bare; put comments on their own lines.

[FTP]
; Optional: reuse any keys from a section in the release tool's ftp_profiles.ini.
; This replaces host/port/username/password (and any other keys supplied there).
; Keys set in this [FTP] section override the profile.
; profile = kobjolke.com - apps
host = ftp.example.com
port = 21
username = deploy_user
password = your_password
; Remote root the tree is mirrored into. Missing directories are created.
remote_path = /
; remote_filename is NOT valid here — sync uploads many files, each keeping its
; own name. The `sync` command rejects the key rather than ignoring it.

[Sync]
; Local directory to upload, relative to --project-root (default: the cwd).
local_dir = releases
; Optional. Comma-separated gitignore-style globs, matched against each file's
; path relative to local_dir (and against each of its parent directories, so
; both `windows` and `windows/**` drop the whole folder).
exclude = windows/**
; Optional, default true. Skip a file whose remote size already matches the local
; one. rclone compares size + modtime; plain FTP has no mtime that is reliable
; across servers, so size alone is the honest equivalent. A file edited without
; changing its length is therefore NOT re-uploaded — set this to false if that
; matters for your content.
skip_unchanged = true
