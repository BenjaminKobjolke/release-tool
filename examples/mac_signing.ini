; Shared per-machine signing identities for `release-tool mac-package`.
; Copy to mac_signing.ini in the release-tool checkout root and set actual values.
; mac-sign needs app_identity and keychain_profile only.
; installer_identity is required only by mac-package.

[MacSigning]
app_identity = Developer ID Application: Your Name (TEAMID)
installer_identity = Developer ID Installer: Your Name (TEAMID)
keychain_profile = your-profile
